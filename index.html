<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>二中·集</title>
<link rel="manifest" href='data:application/manifest+json,{"name":"二中·集","short_name":"二中集","start_url":".","display":"standalone","background_color":"#ffffff","theme_color":"#ffffff","icons":[{"src":"icon-192.png","sizes":"192x192","type":"image/png"},{"src":"icon-512.png","sizes":"512x512","type":"image/png"}]}'>
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#ffffff">
<style>
@font-face{font-family:'ZhiMangXing';src:url('zhimangxing.woff2') format('woff2');font-display:swap;}
:root{
--bg:#fafafa;--card:#ffffff;--card-border:#e5e5e5;
--text:#333333;--text-light:#999999;--accent:#8b1a1a;--gold:#c9a227;
--cyan:#5b9bd5;--purple:#8e7cc3;--pink:#d4739d;--green:#6baf6b;--orange:#e8a04c;
--radius:14px;--shadow:0 2px 12px rgba(0,0,0,0.06);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;}
#entrance{position:fixed;top:0;left:0;width:100%;height:100%;background:var(--bg);z-index:9999;display:flex;align-items:center;justify-content:center;transition:opacity 0.3s ease;opacity:1;}
#entrance.hidden{opacity:0;pointer-events:none;}
#topbar{position:sticky;top:0;z-index:100;background:rgba(250,250,250,0.95);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--card-border);padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap;}
.site-title{font-family:'ZhiMangXing','STXingkai','KaiTi',serif;font-size:26px;color:#8b1a1a;letter-spacing:3px;cursor:default;white-space:nowrap;}
#countdown{font-size:10px;color:var(--text-light);background:var(--card);border:1px solid var(--card-border);border-radius:14px;padding:4px 10px;white-space:nowrap;cursor:default;}
#user-area{display:flex;align-items:center;gap:5px;flex-wrap:wrap;}
#user-btn,#teacher-btn{background:var(--card);border:1px solid var(--card-border);border-radius:14px;padding:4px 10px;color:var(--text);font-size:11px;cursor:pointer;transition:all 0.2s;white-space:nowrap;}
#user-btn:hover,#teacher-btn:hover{background:#f0f0f0;}
#main{max-width:620px;margin:0 auto;padding:12px 14px 90px;}
.mode-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px;}
@media(max-width:480px){.mode-grid{grid-template-columns:repeat(2,1fr);}}
.mode-card{background:var(--card);border:1px solid var(--card-border);border-radius:var(--radius);padding:14px 8px;cursor:pointer;transition:all 0.2s;text-align:center;box-shadow:var(--shadow);}
.mode-card:hover{transform:translateY(-2px);box-shadow:0 4px 16px rgba(0,0,0,0.1);}
.mode-card .icon{font-size:26px;display:block;margin-bottom:5px;}
.mode-card .name{font-size:12px;font-weight:600;}
.mode-card .desc{font-size:9px;color:var(--text-light);margin-top:2px;}
.tag{display:inline-block;padding:3px 9px;border-radius:11px;font-size:11px;margin:2px;cursor:pointer;transition:all 0.2s;border:1px solid var(--card-border);background:var(--card);color:var(--text-light);}
.tag:hover{color:var(--text);border-color:#ccc;}
.tag.active{color:var(--text);border-color:var(--text);font-weight:600;}
.tag-出物{background:#f5f5f5;color:#666;border-color:#ddd;}
.post-card{background:var(--card);border:1px solid var(--card-border);border-radius:var(--radius);padding:12px;margin-bottom:9px;box-shadow:var(--shadow);}
.post-card.pinned{border-color:var(--gold);}
.post-header{display:flex;align-items:center;gap:5px;margin-bottom:6px;flex-wrap:wrap;}
.post-author{font-weight:600;font-size:12px;}
.post-time{font-size:10px;color:var(--text-light);}
.post-content{font-size:13px;line-height:1.7;word-break:break-word;}
.post-actions{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap;}
.action-btn{background:transparent;border:none;color:var(--text-light);font-size:11px;cursor:pointer;padding:3px 7px;border-radius:6px;transition:all 0.2s;}
.action-btn:hover{background:#f0f0f0;color:var(--text);}
.pin-tag{color:var(--gold);font-size:10px;}
.input-area{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap;}
.input-area input,.input-area textarea,.input-area select{flex:1;min-width:0;background:var(--card);border:1px solid var(--card-border);border-radius:10px;padding:8px 12px;color:var(--text);font-size:13px;outline:none;transition:border-color 0.2s;font-family:inherit;}
.input-area input:focus,.input-area textarea:focus{border-color:#bbb;}
.input-area textarea{resize:vertical;min-height:56px;}
.btn{background:var(--card);border:1px solid var(--card-border);border-radius:10px;padding:8px 14px;color:var(--text);font-size:12px;cursor:pointer;transition:all 0.2s;white-space:nowrap;}
.btn:hover{background:#f0f0f0;}
.btn-primary{background:#333;border-color:#333;color:#fff;}
.btn-primary:hover{background:#555;}
.btn:disabled{opacity:0.5;cursor:not-allowed;}
#toast-container{position:fixed;top:55px;left:50%;transform:translateX(-50%);z-index:10000;pointer-events:none;}
.toast{background:rgba(255,255,255,0.95);backdrop-filter:blur(10px);border:1px solid var(--card-border);border-radius:16px;padding:9px 16px;color:var(--text);font-size:12px;margin-bottom:6px;animation:toastIn 0.3s ease,toastOut 0.3s ease 3s forwards;text-align:center;box-shadow:0 4px 20px rgba(0,0,0,0.1);pointer-events:auto;}
@keyframes toastIn{from{opacity:0;}to{opacity:1;}}
@keyframes toastOut{from{opacity:1;}to{opacity:0;}}
.toast button{background:var(--card);border:1px solid var(--card-border);border-radius:8px;padding:3px 10px;font-size:11px;cursor:pointer;margin-left:8px;color:var(--text);}
.toast button:hover{background:#f0f0f0;}
.replies{margin-top:8px;padding-left:10px;border-left:2px solid #eee;}
.reply-item{padding:6px 0;font-size:12px;line-height:1.6;border-bottom:1px solid #f5f5f5;}
.reply-item:last-child{border-bottom:none;}
.reply-author{font-weight:600;color:var(--cyan);margin-right:4px;}
.reply-quote{color:var(--text-light);font-size:11px;background:#f5f5f5;border-radius:6px;padding:3px 7px;margin-bottom:3px;display:inline-block;}
.music-bar{position:fixed;bottom:0;left:0;right:0;z-index:90;padding:7px 16px;background:rgba(255,255,255,0.9);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);cursor:pointer;display:flex;align-items:center;gap:8px;border-top:1px solid var(--card-border);}
.music-bar .song-info{flex:1;min-width:0;}
.music-bar .song-name{font-size:10px;color:#999;transition:color 0.3s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.music-bar .music-icon{font-size:16px;flex-shrink:0;}
#playlist-modal{position:fixed;bottom:55px;left:12px;right:12px;max-width:380px;margin:0 auto;background:#fff;border:1px solid var(--card-border);border-radius:var(--radius);padding:12px;z-index:95;display:none;box-shadow:0 4px 20px rgba(0,0,0,0.12);}
#playlist-modal.show{display:block;animation:slideUp 0.25s ease;}
@keyframes slideUp{from{opacity:0;transform:translateY(15px);}to{opacity:1;transform:translateY(0);}}
.playlist-item{padding:6px 10px;cursor:pointer;border-radius:6px;font-size:10px;color:#999;transition:all 0.2s;}
.playlist-item:hover{background:#f5f5f5;color:#555;}
.playlist-item.active{color:#333;background:#f0f0f0;font-weight:600;}
.bottle{background:#fff;border:1px solid #e0e8f0;border-radius:16px;padding:14px;margin-bottom:10px;cursor:pointer;transition:all 0.3s;box-shadow:var(--shadow);}
.bottle:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,0.1);}
.bottle-icon{display:inline-block;animation:float 3s ease-in-out infinite;}
@keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.4);z-index:200;display:none;align-items:center;justify-content:center;padding:16px;}
.modal-overlay.show{display:flex;}
.modal{background:#fff;border-radius:var(--radius);padding:20px;max-width:400px;width:100%;max-height:80vh;overflow-y:auto;box-shadow:0 10px 40px rgba(0,0,0,0.15);}
.modal h3{margin-bottom:14px;font-size:15px;color:var(--text);}
.side-text{position:fixed;top:50%;transform:translateY(-50%);writing-mode:vertical-rl;font-size:12px;color:#e0e0e0;letter-spacing:6px;pointer-events:none;z-index:1;user-select:none;}
.side-text.left{left:6px;}
.side-text.right{right:6px;}
@media(max-width:600px){.side-text{display:none;}}
.search-bar{display:flex;gap:6px;margin-bottom:8px;}
.search-bar input{flex:1;background:var(--card);border:1px solid var(--card-border);border-radius:10px;padding:7px 12px;color:var(--text);font-size:12px;outline:none;}
.class-card{background:var(--card);border:1px solid var(--card-border);border-radius:12px;padding:10px;margin-bottom:6px;cursor:pointer;transition:all 0.2s;box-shadow:var(--shadow);}
.class-card:hover{background:#fafafa;}
.food-card{background:var(--card);border:1px solid var(--card-border);border-radius:12px;padding:12px;margin-bottom:8px;box-shadow:var(--shadow);}
.food-card .food-header{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:5px;}
.food-card .food-name{font-weight:700;font-size:14px;}
.food-card .food-rating{color:var(--gold);font-size:11px;}
.food-card .food-info{font-size:11px;color:var(--text-light);margin-bottom:3px;}
.food-card .food-comment{font-size:12px;line-height:1.6;color:#555;}
.auth-tab{flex:1;padding:7px 10px;border:1px solid var(--card-border);border-radius:8px;background:var(--card);cursor:pointer;font-size:12px;color:var(--text-light);transition:all 0.2s;text-align:center;}
.auth-tab.active{color:var(--text);font-weight:600;border-color:#bbb;background:#f5f5f5;}
.auth-tab#tab-uid{font-size:10px;}
.social-btn{flex:1;padding:8px 12px;border:1px solid var(--card-border);border-radius:10px;background:var(--card);cursor:pointer;font-size:12px;transition:all 0.2s;text-align:center;}
.social-btn:hover{background:#f5f5f5;}
.social-btn.qq{color:#4a90d9;}
.social-btn.wx{color:#5cb85c;}
.user-info-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #f5f5f5;font-size:13px;}
.user-info-row .label{color:var(--text-light);}
.user-info-row .value{color:var(--text);font-weight:500;}
.bind-btn{background:transparent;border:1px solid var(--card-border);border-radius:6px;padding:2px 8px;font-size:10px;cursor:pointer;color:var(--text-light);}
.bind-btn:hover{background:#f0f0f0;color:var(--text);}
.bind-btn.bound{color:var(--green);border-color:var(--green);}
</style>
</head>
<body>
<div id="entrance"><div style="font-family:'ZhiMangXing','STXingkai','KaiTi',serif;font-size:42px;color:#8b1a1a;letter-spacing:5px;">二中·集</div></div>
<div class="side-text left">青春不散场·二中永流传</div>
<div class="side-text right">岁月如歌·友谊长存</div>
<div id="toast-container"></div>

<header id="topbar">
<div class="site-title">二中·集</div>
<div id="countdown"></div>
<div id="user-area">
<button id="teacher-btn" onclick="showTeacherList()">👨‍🏫评价</button>
<button id="user-btn" onclick="handleUserClick()">登录</button>
</div>
</header>

<main id="main">
<div id="home-view">
<div class="mode-grid">
<div class="mode-card" onclick="switchMode('post')"><span class="icon">📮</span><div class="name">心事箱</div><div class="desc">匿名倾诉</div></div>
<div class="mode-card" onclick="switchMode('food')"><span class="icon">🍜</span><div class="name">必吃榜</div><div class="desc">美食推荐</div></div>
<div class="mode-card" onclick="switchMode('chat')"><span class="icon">💬</span><div class="name">小茶馆</div><div class="desc">聊天+班级</div></div>
<div class="mode-card" onclick="switchMode('bottle')"><span class="icon">🍾</span><div class="name">漂流瓶</div><div class="desc">扔捞回复</div></div>
</div>
</div>

<div id="post-view" style="display:none;">
<button class="btn" onclick="switchMode('home')">← 返回</button>
<div id="post-tags" style="margin:8px 0;"></div>
<div class="search-bar"><input type="text" id="search-input" placeholder="搜索帖子..." onkeydown="if(event.key==='Enter')searchPosts()"><button class="btn" onclick="searchPosts()">搜索</button></div>
<div class="input-area"><textarea id="post-content" placeholder="说点什么...（禁止发链接）" style="flex:1;min-width:100%;"></textarea></div>
<div style="display:flex;align-items:center;gap:5px;margin-bottom:8px;flex-wrap:wrap;">
<button class="btn" onclick="document.getElementById('post-image-input').click()">📷 添加图片</button>
<input type="file" id="post-image-input" accept="image/*" style="display:none;" onchange="handlePostImage(this)">
<div id="post-image-preview" style="display:none;position:relative;">
<img id="post-image-preview-img" src="" style="max-width:120px;max-height:120px;border-radius:8px;border:1px solid var(--card-border);">
<button onclick="removePostImage()" style="position:absolute;top:-6px;right:-6px;background:#333;border:none;color:#fff;border-radius:50%;width:20px;height:20px;font-size:10px;cursor:pointer;">✕</button>
</div>
<span id="post-image-status" style="font-size:10px;color:var(--text-light);"></span>
</div>
<div style="display:flex;gap:5px;margin-bottom:8px;flex-wrap:wrap;align-items:center;">
<select id="post-tag-select" class="btn" style="padding:7px 10px;">
<option value="♥表白">♥表白</option><option value="!吐槽">!吐槽</option><option value="✦祝福">✦祝福</option><option value="◌树洞">◌树洞</option><option value="?寻人">?寻人</option><option value="◆出物">◆出物</option><option value="·其他">·其他</option>
</select>
<button class="btn" id="anon-toggle" onclick="toggleAnon()">匿名</button>
<button class="btn btn-primary" onclick="submitPost()" id="post-submit-btn">发布</button>
</div>
<div id="posts-list"></div>
</div>

<div id="food-view" style="display:none;">
<button class="btn" onclick="switchMode('home')">← 返回</button>
<div class="input-area" style="margin-top:8px;">
<input type="text" id="food-name" placeholder="店名" style="flex:1;min-width:100px;">
<input type="text" id="food-recommend" placeholder="推荐菜" style="flex:1;min-width:100px;">
</div>
<div class="input-area">
<input type="text" id="food-price" placeholder="人均(如:15元)" style="flex:1;">
<select id="food-distance" class="btn" style="flex:1;padding:8px;">
<option value="校门口">校门口</option><option value="步行5分钟">步行5分钟</option><option value="骑车10分钟">骑车10分钟</option><option value="稍远但值得">稍远但值得</option>
</select>
</div>
<div class="input-area">
<select id="food-rating" class="btn" style="flex:1;padding:8px;">
<option value="必吃">必吃</option><option value="不错">不错</option><option value="还行">还行</option>
</select>
</div>
<div class="input-area"><textarea id="food-comment" placeholder="评价一下..." style="flex:1;"></textarea></div>
<button class="btn btn-primary" onclick="submitFood()" id="food-submit-btn">🍜 提交推荐</button>
<div id="foods-list" style="margin-top:10px;"></div>
</div>

<div id="chat-view" style="display:none;">
<button class="btn" onclick="switchMode('home')">← 返回</button>
<div style="display:flex;gap:5px;margin:8px 0;flex-wrap:wrap;" id="room-tabs"></div>
<div class="input-area"><input type="text" id="chat-input" placeholder="发消息..." onkeydown="if(event.key==='Enter')sendChat()"><button class="btn btn-primary" onclick="sendChat()">发送</button></div>
<div id="chat-messages" style="margin-bottom:12px;max-height:300px;overflow-y:auto;"></div>
<hr style="border-color:#eee;margin:12px 0;">
<h3 style="font-size:13px;margin-bottom:6px;">🏫 班级小窝</h3>
<div class="input-area"><input type="text" id="class-name-input" placeholder="输入班级名（如：高一3班）"><button class="btn" onclick="createClass()">创建</button></div>
<div id="classes-list"></div>
</div>

<div id="bottle-view" style="display:none;">
<button class="btn" onclick="switchMode('home')">← 返回</button>
<div class="input-area" style="margin-top:8px;"><textarea id="bottle-content" placeholder="写下你的心事，扔进大海..." style="flex:1;"></textarea></div>
<button class="btn btn-primary" onclick="throwBottle()" id="bottle-submit-btn">🍾 扔出去</button>
<div id="bottles-list" style="margin-top:10px;"></div>
</div>
</main>

<div class="music-bar" onclick="showPlaylist()">
<span class="music-icon">🎵</span>
<div class="song-info"><div class="song-name" id="current-song-name">加载中...</div></div>
</div>
<div id="playlist-modal"><div style="font-size:10px;color:#999;margin-bottom:6px;">🎵 歌单</div><div id="playlist-items"></div></div>

<div class="modal-overlay" id="auth-modal">
<div class="modal">
<h3 id="auth-title">登录</h3>
<div style="display:flex;gap:5px;margin-bottom:12px;">
<button class="auth-tab active" id="tab-nickname" onclick="setAuthTab('nickname')">昵称登录</button>
<button class="auth-tab" id="tab-uid" onclick="setAuthTab('uid')">UID登录</button>
</div>
<div class="input-area" id="auth-nickname-area"><input type="text" id="auth-nickname" placeholder="昵称"></div>
<div class="input-area" id="auth-uid-area" style="display:none;"><input type="text" id="auth-uid" placeholder="UID"></div>
<div class="input-area"><input type="password" id="auth-password" placeholder="密码"></div>
<div class="input-area" id="auth-invite-area" style="display:none;"><input type="text" id="auth-invite" placeholder="邀请口令（选填，站长用1900）"></div>
<div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px;">
<button class="btn btn-primary" onclick="handleAuth()" style="flex:1;">确定</button>
<button class="btn" onclick="toggleAuthMode()">切换注册</button>
</div>
<div style="text-align:center;color:var(--text-light);font-size:11px;margin-bottom:10px;">────── 或 ──────</div>
<div style="display:flex;gap:8px;">
<button class="social-btn qq" onclick="socialLogin('qq')">QQ登录</button>
<button class="social-btn wx" onclick="socialLogin('wx')">微信登录</button>
</div>
</div>
</div>

<div class="modal-overlay" id="reply-modal">
<div class="modal">
<h3 id="reply-title">回复</h3>
<div class="input-area"><textarea id="reply-content" placeholder="写下回复..." style="flex:1;min-width:100%;min-height:70px;"></textarea></div>
<div style="display:flex;align-items:center;gap:5px;margin-bottom:8px;">
<button class="btn" onclick="document.getElementById('reply-image-input').click()">📷 图片</button>
<input type="file" id="reply-image-input" accept="image/*" style="display:none;" onchange="handleReplyImage(this)">
<div id="reply-image-preview" style="display:none;position:relative;">
<img id="reply-image-preview-img" src="" style="max-width:100px;max-height:100px;border-radius:8px;border:1px solid var(--card-border);">
<button onclick="removeReplyImage()" style="position:absolute;top:-6px;right:-6px;background:#333;border:none;color:#fff;border-radius:50%;width:20px;height:20px;font-size:10px;cursor:pointer;">✕</button>
</div>
<span id="reply-image-status" style="font-size:10px;color:var(--text-light);"></span>
</div>
<div style="display:flex;gap:5px;"><button class="btn btn-primary" onclick="submitReply()" style="flex:1;" id="reply-submit-btn">回复</button><button class="btn" onclick="closeReply()">取消</button></div>
</div>
</div>

<div class="modal-overlay" id="user-modal">
<div class="modal">
<h3>👤 用户中心</h3>
<div class="user-info-row"><span class="label">昵称</span><span class="value" id="user-info-nickname"></span></div>
<div class="user-info-row"><span class="label">身份</span><span class="value" id="user-info-role"></span></div>
<div class="user-info-row"><span class="label">UID</span><span class="value" id="user-info-uid"></span></div>
<div class="user-info-row"><span class="label">QQ</span><span class="value" id="user-info-qq"></span></div>
<div class="user-info-row"><span class="label">微信</span><span class="value" id="user-info-wx"></span></div>
<div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;">
<button class="btn" onclick="showUsersModal()" id="user-list-btn" style="display:none;">用户列表</button>
<button class="btn" onclick="logout()" style="flex:1;">退出登录</button>
</div>
</div>
</div>

<div class="modal-overlay" id="users-modal">
<div class="modal">
<h3>👥 用户列表（仅站长）</h3>
<div class="search-bar"><input type="text" id="user-search" placeholder="搜索用户..." onkeydown="if(event.key==='Enter')loadUsers()"><button class="btn" onclick="loadUsers()">搜索</button></div>
<div id="users-list"></div>

  if (diff < 3600) return Math.floor(diff/60) + '分钟前';

      'Content-Type': file.type,

  var el = document.getElementById('countdown');
  if (diff <= 0) { el.style.display = 'none'; return; }
  var days = Math.floor(diff / 86400000);
  var hours = Math.floor((diff % 86400000) / 3600000);
  var mins = Math.floor((diff % 3600000) / 60000);
  var secs = Math.floor((diff % 60000) / 1000);

    var isAdmin = currentUser && (currentUser.isadmin || currentUser.isowner);
    if (!isAdmin && containsLink(content)) { showToast('🚫','非管理员不能发链接'); return; }
    var author = isAnon ? randomAnonName() : currentUser.nickname;
    var fullContent = content;
    if (postImageUrl) fullContent = content ? content+'\n[图片]'+postImageUrl : '[图片]'+postImageUrl;
    var post = {content:fullContent,tag:tag,author:author,authorclass:'',time:getNowTime(),pinned:false,author_uid:currentUser.uid};
    var btn = document.getElementById('post-submit-btn');

        btn.disabled = false; btn.textContent = '发布';
        document.getElementById('post-content').value = '';
        removePostImage();
        showToast('📮','发布成功！');
        loadPosts();
      })
      .catch(function(){ btn.disabled = false; btn.textContent = '发布'; showToast('❌','发布失败'); });

}
function loadPosts() {
  supabaseClient.query('posts','GET',null,'?order=time.desc')
    .then(function(posts) {
      allPosts = posts || [];
      allPosts.sort(function(a,b){
        var aP = a.pinned === true ? 1 : 0;
        var bP = b.pinned === true ? 1 : 0;
        if (aP !== bP) return bP - aP;
        return new Date(b.time) - new Date(a.time);
      });
      renderPosts(allPosts);
      checkUnreadReplies();
    });
}
function renderPosts(posts) {
  var container = document.getElementById('posts-list');
  if (!posts || posts.length === 0) {
    container.innerHTML = '<p style="color:var(--text-light);font-size:12px;text-align:center;padding:20px;">暂无帖子</p>';
    return;
  }
  var filtered = currentTag === '全部' ? posts : posts.filter(function(p){return p.tag===currentTag;});
  container.innerHTML = filtered.map(function(post){ return renderPostCard(post); }).join('');
  // 加载回复
  filtered.forEach(function(post){ loadReplies(post.id); });
}
function renderPostCard(post) {
  var isAdmin = currentUser && (currentUser.isadmin || currentUser.isowner);
  var pinnedCls = post.pinned ? ' pinned' : '';
  var pinTag = post.pinned ? '<span class="pin-tag">📌</span>' : '';
  var actions = '';
  if (isAdmin) {
    actions += '<button class="action-btn" onclick="togglePin('+post.id+','+(post.pinned?'false':'true')+')">'+(post.pinned?'取消置顶':'置顶')+'</button>';
    actions += '<button class="action-btn" onclick="deletePost('+post.id+')">删帖</button>';
  }
  actions += '<button class="action-btn" onclick="openReply('+post.id+')">回复</button>';
  return '<div class="post-card'+pinnedCls+'" id="post-'+post.id+'">' +
    '<div class="post-header">' +
    '<span class="post-author">'+escapeHtml(post.author)+'</span>' +
    pinTag +
    '<span class="post-time">'+formatTime(post.time)+'</span>' +
    '<span class="tag" style="font-size:10px;padding:2px 7px;">'+escapeHtml(post.tag)+'</span>' +
    '</div>' +
    '<div class="post-content">'+renderContentWithImages(post.content)+'</div>' +
    '<div class="post-actions">'+actions+'</div>' +
    '<div class="replies" id="replies-'+post.id+'"></div>' +
    '</div>';
}
function loadReplies(postId) {
  supabaseClient.query('replies','GET',null,'?post_id=eq.'+postId+'&order=time.asc')
    .then(function(replies){
      var container = document.getElementById('replies-'+postId);
      if (!container) return;
      if (!replies || replies.length === 0) { container.innerHTML = ''; return; }
      container.innerHTML = replies.map(function(r){
        var quote = r.reply_to && r.reply_to_author ? '<div class="reply-quote">回复 @'+escapeHtml(r.reply_to_author)+'</div>' : '';
        return '<div class="reply-item">' +
          quote +
          '<span class="reply-author">'+escapeHtml(r.author)+'</span>' +
          '<span>'+renderContentWithImages(r.content)+'</span>' +
          '<span style="color:var(--text-light);font-size:10px;margin-left:4px;">'+formatTime(r.time)+'</span>' +
          '<button class="action-btn" onclick="setReplyTarget('+postId+','+r.id+',\''+escapeHtml(r.author)+'\')">回复</button>' +
          '</div>';
      }).join('');

}
function openReply(postId) {

function setReplyTarget(postId, replyId, author) {

function closeReply() { document.getElementById('reply-modal').classList.remove('show'); }
function submitReply() {

    if (!isAdmin && containsLink(content)) { showToast('🚫','非管理员不能发链接'); return; }
    var author = isAnon ? randomAnonName() : currentUser.nickname;

function togglePin(postId, status) {

    .then(function(){ showToast('📌',status?'已置顶':'已取消置顶'); loadPosts(); });
}
function deletePost(postId) {
  if (!confirm('确定删除此帖？')) return;
  supabaseClient.query('posts','DELETE',null,'?id=eq.'+postId)
    .then(function(){
      return supabaseClient.query('replies','DELETE',null,'?post_id=eq.'+postId);
    })
    .then(function(){ showToast('🗑️','已删除'); loadPosts(); });
}
function searchPosts() {
  var keyword = document.getElementById('search-input').value.trim();
  if (!keyword) { loadPosts(); return; }
  supabaseClient.query('posts','GET',null,'?content=ilike.*'+encodeURIComponent(keyword)+'*&order=time.desc')
    .then(function(posts){ allPosts = posts || []; renderPosts(allPosts); });
}
function checkUnreadReplies(forceShow) {
  if (!currentUser) return;
  supabaseClient.query('posts','GET',null,'?author_uid=eq.'+currentUser.uid)
    .then(function(posts){
      if (!posts || posts.length === 0) return;
      var postIds = posts.map(function(p){return p.id;});
      var totalUnread = 0;
      var firstPostId = null;
      var promises = postIds.map(function(pid){
        return supabaseClient.query('replies','GET',null,'?post_id=eq.'+pid+'&is_read=eq.false')
          .then(function(replies){
            if (replies && replies.length > 0) {
              totalUnread += replies.length;
              if (!firstPostId) firstPostId = pid;
            }
          });
      });
      Promise.all(promises).then(function(){
        if (totalUnread > 0) {
          showToast('💬','你有 '+totalUnread+' 条未读回复', firstPostId);
        }
      });
    });
}
function goToPost(postId) {
  switchMode('post');
  setTimeout(function(){
    var postEl = document.getElementById('post-'+postId);
    if (postEl) {
      postEl.scrollIntoView({behavior:'smooth',block:'center'});
      postEl.style.borderColor = '#5b9bd5';
      postEl.style.boxShadow = '0 0 20px rgba(91,155,213,0.3)';
      setTimeout(function(){ postEl.style.borderColor = ''; postEl.style.boxShadow = ''; }, 2000);
      supabaseClient.query('replies','PATCH',{is_read:true},'?post_id=eq.'+postId+'&is_read=eq.false').then(function(){});
    }
  }, 300);
}

      .then(function(){ document.getElementById('chat-input').value=''; loadChatMessages(); });

function loadChatMessages() {

  } else {
    supabaseClient.query('chat_messages','GET',null,'?room=eq.'+encodeURIComponent(currentRoom)+'&order=time.asc').then(renderChatMessages);

  var review = {teacher_id:currentTeacherId,rating:rating,content:content,author:isAnon?randomAnonName():currentUser.nickname,time:getNowTime()};
  supabaseClient.query('teacher_reviews','POST',review)
    .then(function(){ showToast('✅','评价成功！'); loadTeacherReviews(currentTeacherId); });
}

// ==================== 用户列表（站长） ====================
function showUsersModal() { closeUserModal(); document.getElementById('users-modal').classList.add('show'); loadUsers(); }
function closeUsers() { document.getElementById('users-modal').classList.remove('show'); }
function loadUsers() {
  var search = document.getElementById('user-search').value.trim();
  var params = '?select=nickname,uid,isadmin,isowner&order=uid.asc';
  if (search) params += '&nickname=ilike.*'+encodeURIComponent(search)+'*';
  supabaseClient.query('users','GET',null,params)
    .then(function(users){
      var list = document.getElementById('users-list');
      list.innerHTML = users.map(function(u){
        return '<div style="padding:7px;border-bottom:1px solid #f5f5f5;display:flex;align-items:center;gap:6px;flex-wrap:wrap;">' +
          '<span style="font-weight:600;">'+escapeHtml(u.nickname)+' '+(u.isowner?'👑':'')+(u.isadmin?'⭐':'')+'</span>' +
          '<span style="color:var(--text-light);font-size:10px;">UID: '+u.uid+'</span>' +
          (u.isadmin && !u.isowner ? '<button class="action-btn" onclick="toggleAdmin('+u.uid+',false)">取消管理员</button>' : '') +
          (!u.isadmin && !u.isowner ? '<button class="action-btn" onclick="toggleAdmin('+u.uid+',true)">设为管理员</button>' : '') +
          '</div>';
      }).join('');
    });
}
function toggleAdmin(uid, makeAdminFlag) {
  if (makeAdminFlag) {
    supabaseClient.query('users','GET',null,'?isadmin=eq.true&isowner=eq.false')
      .then(function(admins){
        if (admins && admins.length >= 3) { showToast('⚠️','管理员已达上限（3人）'); return; }
        doToggleAdmin(uid,true);
      });
  } else { doToggleAdmin(uid,false); }
}
function doToggleAdmin(uid, makeAdminFlag) {
  supabaseClient.query('users','PATCH',{isadmin:makeAdminFlag},'?uid=eq.'+uid)
    .then(function(){
      showToast('✅',makeAdminFlag?'已设为管理员':'已取消管理员');
      loadUsers();
      if (currentUser && currentUser.uid == uid) {
        currentUser.isadmin = makeAdminFlag;
        saveUserToStorage();
        updateUserUI();
      }
    });
}
</script>
